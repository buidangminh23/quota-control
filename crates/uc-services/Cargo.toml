[package]
name = "uc-services"
description = "Quota readers for AI services beyond Claude and Codex"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
default = ["gemini", "antigravity"]
all = ["gemini", "antigravity", "copilot", "cursor", "kiro", "grok", "opencode", "ollama", "devin", "zed", "qoder", "codebuddy", "zai", "minimax", "kimi", "deepseek", "openrouter", "groq", "vercel", "siliconflow", "chutes", "commandcode", "xai", "openai", "anthropic"]
gemini = []
antigravity = []
copilot = []
cursor = []
kiro = []
grok = []
opencode = []
ollama = []
devin = []
zed = []
qoder = []
codebuddy = []
zai = []
minimax = []
kimi = []
deepseek = []
openrouter = []
groq = []
vercel = []
siliconflow = []
chutes = []
commandcode = []
xai = []
openai = []
anthropic = []

[dependencies]
uc-core.workspace = true
uc-accounts.workspace = true
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
dirs.workspace = true
ring = "0.17"
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio.workspace = true
toml = "0.8"
tracing.workspace = true
url.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_Security_Cryptography"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

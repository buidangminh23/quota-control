[package]
name = "quota-control"
description = "Quota Control: AI coding subscription limits in the Windows and Linux system tray"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
default-run = "quota-control"

[lib]
name = "quota_control_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "quota-control"
path = "src/main.rs"

[[bin]]
name = "usagectl"
path = "src/bin/usagectl.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
chrono.workspace = true
parking_lot.workspace = true
quick-xml = "0.41"
semver = "1"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
uc-api.workspace = true
uc-core.workspace = true
uc-accounts.workspace = true
uc-engine.workspace = true
uc-providers.workspace = true
uc-logscan.workspace = true
url.workspace = true
uuid.workspace = true

tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = { version = "2.12", default-features = false, features = ["rustls-tls", "system-proxy"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
] }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", default-features = false, features = ["tokio"] }

[dev-dependencies]
async-trait.workspace = true
tempfile.workspace = true
tauri = { version = "2", features = ["test"] }

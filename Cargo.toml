[workspace]
resolver = "3"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "0.3.28"
edition = "2024"
license = "MIT"
repository = "https://github.com/buidangminh23/quota-control"
authors = ["Bui Dang Minh"]
rust-version = "1.90"

[workspace.dependencies]
uc-core = { path = "crates/uc-core" }
uc-accounts = { path = "crates/uc-accounts" }
uc-pricing = { path = "crates/uc-pricing" }
uc-logscan = { path = "crates/uc-logscan" }
uc-providers = { path = "crates/uc-providers" }
uc-services = { path = "crates/uc-services" }
uc-engine = { path = "crates/uc-engine" }
uc-api = { path = "crates/uc-api" }

anyhow = "1"
async-trait = "0.1"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
dirs = "7"
futures = "0.3"
memchr = "2"
parking_lot = "0.12"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "socks", "gzip", "brotli", "http2", "charset", "query", "form"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net", "process"] }
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = "symbols"
panic = "abort"

[profile.dev.package."*"]
opt-level = 2

# Tauri 2's Linux stack needs glib 0.18, which never received the fix for GHSA-wrw7-89jp-8q8g
# (fixed upstream in 0.20). third_party/README.md explains the copy and when to remove it.
[patch.crates-io]
glib = { path = "third_party/glib" }
